<script>
const APP_URL = "https://script.google.com/macros/s/AKfycbwIXkDshzDxPsoWnsggh2Pwvb6KW8vQypA7db7RkccIh5YJBCzZdwy2YVrYbzSLZl4hwg/exec";

const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent);
const isStandalone =
  window.matchMedia("(display-mode: standalone)").matches ||
  window.navigator.standalone;

// คอม -> เข้า WebApp ทันที
// iPhone หน้า Home -> เข้า WebApp ทันที
// iPhone Safari -> อยู่หน้านี้เพื่อ Add to Home
if (!isIOS || isStandalone) {
  window.location.replace(APP_URL);
}
</script>
